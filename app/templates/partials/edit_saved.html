{% if error %}
<div class="banner banner-warning">{{ error }}</div>
{% elif pdf_ok %}
<div class="banner banner-info">
  Saved. <a href="{{ pdf_url }}" download>Download updated PDF</a>
</div>
{% else %}
<div class="banner banner-warning">
  Edits saved to the HTML, but PDF conversion failed.
  Use <kbd>Ctrl+P → Save as PDF</kbd> from the preview instead.
</div>
{% endif %}
